---
apiVersion: batch/v1
kind: Job
metadata:
  namespace: {{ $.Values.logefrei.namespace }}
  name: migrate-job
  labels:
    app: migrate-job
spec:
  template:
    spec:
      containers:
        - name: migrate
          image: "{{ $.Values.logefrei.back.image.repository }}:{{ $.Values.logefrei.back.image.tag }}"
          command: ["sh", "-c", "bunx prisma migrate deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.logefrei.database.secret }}
                  key: DATABASE_URL
      restartPolicy: Never
  backoffLimit: 1
{{- range .Values.logefrei.back.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ $.Values.logefrei.namespace }}
  name: {{ .name }}
  labels:
    app: {{ .name }}
    version: {{ $.Chart.AppVersion }}
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
    spec:
      initContainers:
        - name: wait-for-migration
          image: busybox
          command: ['sh', '-c', 'until kubectl get job migrate-job -n {{ $.Values.logefrei.namespace }} -o jsonpath="{.status.succeeded}" | grep 1; do echo waiting for migration job to complete; sleep 5; done']
      containers:
        - name: {{ .name }}
          image: "{{ $.Values.logefrei.back.image.repository }}:{{ $.Values.logefrei.back.image.tag }}"
          imagePullPolicy: Always
          env:
            - name: SERVICE
              value: {{ .name }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.logefrei.database.secret }}
                  key: DATABASE_URL
            - name: PORT
              value: "3000"
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ $.Values.logefrei.namespace }}
  name: {{ .name }}
  labels:
    app: {{ .name }}
    version: {{ $.Chart.AppVersion }}
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: {{ .name }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  namespace: {{ $.Values.logefrei.namespace }}
  name: {{ .name }}
  labels:
    app: {{ .name }}
    version: {{ $.Chart.AppVersion }}
spec:
  routes:
    - match: Host(`{{ $.Values.logefrei.host }}`) && PathPrefix(`/api/{{ .name }}`)
      kind: Rule
      services:
        - name: {{ .name }}
          port: 3000
      middlewares:
        - name: ak-outpost-authentik-embedded-outpost
    {{- if eq .name "bookings" }}
    - match: Host(`{{ $.Values.logefrei.host }}`) && PathPrefix(`/docs`)
      kind: Rule
      services:
        - name: {{ .name }}
          port: 3000
      middlewares:
        - name: ak-outpost-authentik-embedded-outpost
    {{- end }}
{{- end }}
